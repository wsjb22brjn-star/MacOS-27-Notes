<head>

<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

  --hl:rgba(255,255,255,.95);--edge:rgba(255,255,255,.5);--shade:rgba(0,0,0,.10);--sel:rgba(255,204,0,.55);--acc:#f0a900;

  --glass:rgba(38,38,48,.36);--glass2:rgba(255,255,255,.16);--tx:#f5f5f7;--tx2:rgba(235,235,245,.6);
  --hl:rgba(255,255,255,.28);--edge:rgba(255,255,255,.14);--shade:rgba(0,0,0,.35);--sel:rgba(255,214,10,.38);--acc:#ffd60a;
  --w1:#7a3b5e;--w2:#8a5a1e;--w3:#1f3f8a;--w4:#4b2a86;--wbase:#101018;color-scheme:dark}}
:root[data-theme="dark"]{
  --glass:rgba(38,38,48,.36);--glass2:rgba(255,255,255,.16);--tx:#f5f5f7;--tx2:rgba(235,235,245,.6);
  --hl:rgba(255,255,255,.28);--edge:rgba(255,255,255,.14);--shade:rgba(0,0,0,.35);--sel:rgba(255,214,10,.38);--acc:#ffd60a;
  --w1:#7a3b5e;--w2:#8a5a1e;--w3:#1f3f8a;--w4:#4b2a86;--wbase:#101018;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:-apple-system,"SF Pro Text","Segoe UI","Heebo","Arial Hebrew",Arial,sans-serif;color:var(--tx);background:var(--wbase);overflow:hidden;font-size:15px}
.wall{position:fixed;inset:0;z-index:0;overflow:hidden}
.wall i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.95}
.wall i:nth-child(1){width:60vmax;height:60vmax;background:var(--w1);top:-20vmax;inset-inline-start:-10vmax}
.wall i:nth-child(2){width:50vmax;height:50vmax;background:var(--w2);bottom:-15vmax;inset-inline-end:10vmax}
.wall i:nth-child(3){width:55vmax;height:55vmax;background:var(--w3);top:10vmax;inset-inline-end:-20vmax}
.wall i:nth-child(4){width:40vmax;height:40vmax;background:var(--w4);bottom:-10vmax;inset-inline-start:5vmax}
.win{position:fixed;z-index:1;inset:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:230px 320px 1fr;gap:10px}
/* Liquid Glass */
.glass{position:relative;background:linear-gradient(135deg,var(--glass2),var(--glass) 40%,var(--glass));
  -webkit-backdrop-filter:blur(26px) saturate(1.9) brightness(1.06);backdrop-filter:blur(26px) saturate(1.9) brightness(1.06);
  box-shadow:inset 0 1.5px 0 var(--hl),inset 0 -1px 0 var(--shade),inset 0 0 0 1px var(--edge),inset 0 0 18px 2px var(--glass2),0 14px 40px var(--shade),0 2px 6px var(--shade)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(180px 120px at var(--mx,30%) var(--my,-10%),var(--hl),transparent 70%);opacity:.55;transition:opacity .3s}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;
  background:linear-gradient(160deg,var(--hl),transparent 35%,transparent 65%,var(--hl));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}
.pane{border-radius:30px;display:none;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
.pane{display:flex}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:76px 10px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{position:absolute;z-index:3;top:10px;inset-inline:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:2px;padding:4px;border-radius:999px;align-items:center}
.ib{width:34px;height:34px;border:0;background:none;color:var(--tx);border-radius:50%;display:grid;place-items:center;cursor:pointer;font:inherit;font-size:16px;position:relative;z-index:1}
.ib:hover{background:var(--glass2)}.ib:active{transform:scale(.92)}.ib.on{background:var(--sel)}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.dots{display:flex;gap:8px;padding:6px 8px;position:relative;z-index:1}
.dots b{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.dots b:nth-child(1){background:#ff5f57}.dots b:nth-child(2){background:#febc2e}.dots b:nth-child(3){background:#28c840}
.fi,.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;cursor:pointer;position:relative;z-index:1}
.fi svg{width:20px;height:20px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fi em{margin-inline-start:auto;font-style:normal;color:var(--tx2);font-size:13px}
.fi.sel,.ni.sel{background:var(--sel);box-shadow:inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--edge)}
.lbl{padding:14px 12px 4px;color:var(--tx2);font-size:13px;font-weight:600}
.ni{flex-direction:column;align-items:stretch;gap:3px;margin-bottom:2px}
.ni b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni span{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni span u{text-decoration:none;color:var(--tx);margin-inline-end:8px}
.search{flex:1;display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;border-radius:999px;min-width:0}
.search svg{width:17px;height:17px;fill:none;stroke:var(--tx2);stroke-width:2;stroke-linecap:round;flex:none;position:relative;z-index:1}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--tx);font:inherit;position:relative;z-index:1}
.search input::placeholder{color:var(--tx2)}
#ed,.ed{outline:0;padding:0 28px 80px;font-size:17px;line-height:1.65;min-height:60%}
#ed>*,.ed>*{unicode-bidi:plaintext;text-align:start;margin:0}
#ed>:first-child,.ed>:first-child{font-size:30px;font-weight:700;line-height:1.3;margin-bottom:6px}
#ed h2,.ed h2{font-size:21px}
#ed ul,.ed ul{padding-inline-start:1.5em}
.chk{position:relative;padding-inline-start:32px!important}
.chk::before{content:"";position:absolute;inset-inline-start:2px;top:.42em;width:20px;height:20px;border-radius:50%;border:1.7px solid var(--tx2);cursor:pointer;color:#1d1d1f;font-size:12px;line-height:17px;text-align:center}
.chk.done::before{content:"✓";background:var(--acc);border-color:var(--acc);font-weight:700}
.chk.done{color:var(--tx2);text-decoration:line-through}
.empty{height:100%;display:grid;place-items:center;color:var(--tx2);text-align:center;padding:20px}
.edp-date{text-align:center;color:var(--tx2);font-size:12.5px;padding:0 28px 14px}
.nar{display:none}
[dir=rtl] .flip svg{transform:scaleX(-1)}
@media (max-width:0px){
  .win{grid-template-columns:1fr}
  .pane{display:none}
  body[data-v=side] #side,body[data-v=list] #list,body[data-v=ed] #edp{display:flex}
  .nar{display:grid}.dots{display:none}
}
:root{--wbase:#fff;--paper:#fff;--side:rgba(236,236,240,.8);--line:rgba(0,0,0,.08);--sel:#ffe27a;--hl:rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wbase:#0f0f12;--paper:#1c1c20;--side:rgba(70,70,82,.5);--line:rgba(255,255,255,.1)}}

.wall i{display:none}

#side{margin:8px;border-radius:22px;background:var(--side);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.06)}
#list,#edp{background:var(--paper);border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#list::before,#list::after,#edp::before,#edp::after{display:none}
#list{border-inline-end:1px solid var(--line)}
.top .glass{background:linear-gradient(135deg,rgba(255,255,255,.75),var(--glass));box-shadow:0 6px 20px rgba(0,0,0,.12),inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--line),inset 0 0 14px 1px var(--glass2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top .glass{background:linear-gradient(135deg,rgba(255,255,255,.14),var(--glass))}}
:root[data-theme="dark"] .top .glass{background:linear-gradient(135deg,rgba(255,255,255,.14),var(--glass))}
.ni{border-radius:14px;padding:11px 14px}
.ni:not(.sel){box-shadow:0 1px 0 var(--line)}
.ni.sel,.fi.sel{box-shadow:none;color:#1d1d1f}
.ni.sel span{color:rgba(29,29,31,.65)}.ni.sel span u{color:#1d1d1f}
.lbl{font-weight:700}
@media (max-width:0px){.win{inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);border-radius:0;box-shadow:none}#side{margin:0;border-radius:0}}
.win{position:fixed;inset:auto;top:env(safe-area-inset-top,0px);left:0;border-radius:0;box-shadow:none;width:var(--w,760px);height:calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))/var(--s,1));transform:scale(var(--s,1));transform-origin:0 0;grid-template-columns:var(--c1,190px) var(--c2,240px) minmax(0,1fr)}
#folders{padding:20px 10px 80px}.fi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .glass{background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.16) 50%,rgba(255,255,255,.3));-webkit-backdrop-filter:blur(10px) saturate(2) brightness(1.06);backdrop-filter:blur(10px) saturate(2) brightness(1.06);box-shadow:0 8px 24px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.08),inset 1.5px 1.5px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(0,0,0,.07),inset 0 0 0 1px var(--line),inset 2px 2px 3px -1px rgba(255,90,140,.28),inset -2px -2px 3px -1px rgba(70,170,255,.3),inset 0 0 16px 2px rgba(255,255,255,.4);transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
.top .glass:active{transform:scale(1.05)}
html{overflow:hidden;width:100%}.top .bar .ib{width:32px;height:32px}.top{min-width:0}
.top .glass.lensed{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 50%,rgba(255,255,255,.12))}
.lens{position:absolute;inset:0;z-index:-1;overflow:hidden;border-radius:inherit;background:var(--paper);pointer-events:none}
.lc{position:absolute;overflow:visible!important;height:auto!important;flex:none!important;color:var(--tx)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-v="list">
<div class="wall"><i></i><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs></defs></svg>
<div class="win">
  <section class="pane glass" id="side">
    
    <div class="scroll" id="folders"></div>
    <div class="top" style="top:auto;bottom:10px">
      <div class="bar glass"><button class="ib" id="lang" title="Language" style="width:auto;padding:0 12px;font-size:13px;font-weight:600"></button><button class="ib" id="theme" data-i="moon" title="Theme"></button></div>
    </div>
  </section>
  <section class="pane glass" id="list">
    <div class="top">
      <button class="ib nar bar glass" id="toSide" data-i="side" style="width:42px;height:42px"></button>
      <label class="search glass"><svg viewBox="0 0 24 24" data-i="search"></svg><input id="q" type="search" dir="auto"></label>
      <div class="bar glass"><button class="ib" id="new" data-i="new"></button></div>
    </div>
    <div class="scroll" id="notes"></div>
  </section>
  <section class="pane glass" id="edp">
    <div class="top">
      <div class="bar glass nar flip"><button class="ib" id="back" data-i="back"></button></div>
      <div class="bar glass">
        <button class="ib" data-c="formatBlock" data-v="h2" data-i="head" title="H"></button>
        <button class="ib" data-c="bold" style="font-weight:800">B</button>
        <button class="ib" data-c="italic" style="font-style:italic;font-family:serif">I</button>
        <button class="ib" data-c="underline" style="text-decoration:underline">U</button>
        <button class="ib" data-c="insertUnorderedList" data-i="list"></button>
        <button class="ib" id="chk" data-i="chk"></button>
      </div>
      <div class="sp"></div>
      <div class="bar glass"><button class="ib" id="pin" data-i="pin"></button><button class="ib" id="del" data-i="trash"></button></div>
    </div>
    <div class="scroll" id="edw"><div class="edp-date" id="date"></div><div id="ed" class="ed" contenteditable="true" spellcheck="true"></div><div class="empty" id="none" hidden></div></div>
  </section>
</div>
<script>
var IC={
 new:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 pin:'<path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/>',
 chk:'<circle cx="12" cy="12" r="8"/><path d="M9 12l2 2 4-4"/>',
 list:'<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 back:'<path d="M15 6l-6 6 6 6"/>',
 side:'<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
 folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
 head:'<path d="M6 5v14M18 5v14M6 12h12"/>'};
var svg=function(k){return '<svg viewBox="0 0 24 24">'+IC[k]+'</svg>'};
var T={
 he:{all:'כל הפתקים',notes:'פתקים',quick:'פתקים מהירים',travel:'טיולים',personal:'אישי',folders:'תיקיות',search:'חיפוש',pinned:'מוצמדים',today:'היום',earlier:'קודם',none:'אין פתקים כאן. הקישו על כפתור הכתיבה כדי להתחיל.',nosel:'בחרו פתק או צרו חדש',untitled:'פתק חדש',nomore:'אין טקסט נוסף',lang:'English',loc:'he-IL'},
 en:{all:'All Notes',notes:'Notes',quick:'Quick Notes',travel:'Travel',personal:'Personal',folders:'Folders',search:'Search',pinned:'Pinned',today:'Today',earlier:'Earlier',none:'No notes here. Tap the compose button to start.',nosel:'Select a note or create a new one',untitled:'New Note',nomore:'No additional text',lang:'עברית',loc:'en-US'}};
var FO=['all','notes','quick','travel','personal'];
var now=Date.now(),H=36e5;
var S={lang:'he',theme:'',folder:'all',sel:null,q:'',notes:[
 {id:1,f:'notes',pin:1,ts:now-H,html:'<div>ברוכים הבאים לפתקים</div><div>זכוכית נוזלית אמיתית, עברית מלאה, ופריסה שמתהפכת מימין לשמאל.</div><div class="chk done">כתיבה בעברית</div><div class="chk">לנסות להקליק עליי</div><div>Mixed English lines flow left to right.</div>'},
 {id:2,f:'travel',ts:now-3*H,html:'<div>טיול בניו אורלינס</div><div>שבת 5/13</div><div>בית הקברות לאפייט, סיור בגן העדן</div><div>מסעדת פירות ים סופיריור, שמורה מקום</div><div>תיאטרון סאנגר, 19:00</div><div>יום ראשון 5/14</div><div>קפה בניה, ואז סיור בבית המטעים</div>'},
 {id:3,f:'personal',ts:now-30*H,html:'<div>רשימת קניות</div><div class="chk">חלב</div><div class="chk done">לחם</div><div class="chk">עגבניות</div><div class="chk">קפה</div>'},
 {id:4,f:'quick',ts:now-60*H,html:'<div>רעיון לאפליקציה</div><div>מצב כהה שמתחלף לפי שעות היום, עם רקע שמשתנה לאט.</div>'}]};
try{var sv=JSON.parse(localStorage.getItem('notes28')||'null');if(sv&&sv.notes){S=sv}else{S.notes=[]}}catch(e){S.notes=[]}
function save(){try{localStorage.setItem('notes28',JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var ed=$('ed');
function txt(h){var d=document.createElement('div');d.innerHTML=h.replace(/<\/(div|h2|li|p)>/gi,'$&\n');return d.textContent}
function lines(h){return txt(h).split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function t(k){return T[S.lang][k]}
function fmt(ts){var d=new Date(ts),n=new Date(),L=t('loc');
 return d.toDateString()===n.toDateString()?d.toLocaleTimeString(L,{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString(L,{day:'numeric',month:'short'})}
function vis(){var q=S.q.trim().toLowerCase();
 return S.notes.filter(function(n){return (S.folder==='all'||n.f===S.folder)&&(!q||txt(n.html).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){return b.ts-a.ts})}
function cur(){return S.notes.filter(function(n){return n.id===S.sel})[0]}
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function rFolders(){
 var h='<div class="lbl">'+t('folders')+'</div>';
 FO.forEach(function(f){var c=f==='all'?S.notes.length:S.notes.filter(function(n){return n.f===f}).length;
  h+='<div class="fi'+(S.folder===f?' sel':'')+'" data-f="'+f+'">'+svg('folder')+'<span>'+t(f)+'</span><em>'+c+'</em></div>'});
 $('folders').innerHTML=h}
function rList(){
 var L=vis(),h='',g=null,td=new Date().toDateString();
 L.forEach(function(n){
  var k=n.pin?'pinned':(new Date(n.ts).toDateString()===td?'today':'earlier');
  if(k!==g){g=k;h+='<div class="lbl">'+t(k)+'</div>'}
  var ln=lines(n.html);
  h+='<div class="ni'+(n.id===S.sel?' sel':'')+'" data-n="'+n.id+'"><b dir="auto">'+esc(ln[0]||t('untitled'))+'</b><span dir="auto"><u>'+fmt(n.ts)+'</u>'+esc(ln[1]||t('nomore'))+'</span></div>'});
 $('notes').innerHTML=h||'<div class="empty">'+t('none')+'</div>'}
function rEd(){
 var n=cur();
 $('none').hidden=!!n;ed.hidden=!n;$('date').hidden=!n;$('none').textContent=t('nosel');
 if(n){ed.innerHTML=n.html;$('date').textContent=new Date(n.ts).toLocaleString(t('loc'),{dateStyle:'long',timeStyle:'short'})}
 $('pin').classList.toggle('on',!!(n&&n.pin))}
function ui(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='he'?'rtl':'ltr';
 if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme;
 $('q').placeholder=t('search');$('lang').textContent=t('lang');
 rFolders();rList();rEd()}
function view(v){document.body.dataset.v=v}
function pick(id){S.sel=id;rList();rEd();view('ed');save()}
document.querySelectorAll('[data-i]').forEach(function(e){var s=svg(e.dataset.i);if(e.tagName==='svg'){e.innerHTML=IC[e.dataset.i]}else e.innerHTML=s});
$('folders').onclick=function(e){var f=e.target.closest('[data-f]');if(!f)return;S.folder=f.dataset.f;S.sel=null;ui();view('list');save()};
$('notes').onclick=function(e){var n=e.target.closest('[data-n]');if(n)pick(+n.dataset.n)};
$('q').oninput=function(){S.q=this.value;rList()};
$('new').onclick=function(){
 var id=Date.now(),f=(S.folder==='all')?'notes':S.folder;
 S.notes.push({id:id,f:f,ts:id,html:'<div><br></div>'});S.q='';$('q').value='';S.sel=id;ui();view('ed');ed.focus();save()};
